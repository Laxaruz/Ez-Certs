<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EZ CERTS | Panel de Empleado</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg bg-white border-bottom">
    <div class="container">
        <span class="navbar-brand fw-semibold">EZ CERTS - Panel de Empleado</span>
        <div class="ms-auto">
            <form th:action="@{/logout}" method="post">
                <button class="btn btn-outline-danger" type="submit">Salir</button>
            </form>
        </div>
    </div>
</nav>

<main class="container py-4">
    <div class="row g-4">
        <div class="col-md-4">
            <div class="card h-100 shadow-sm">
                <div class="card-body">
                    <h5 class="card-title">Solicitar Certificado Laboral</h5>
                    <p class="card-text text-muted">Genera tu certificado laboral en PDF.</p>
                    <button class="btn btn-primary w-100" type="button">Ir</button>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card h-100 shadow-sm">
                <div class="card-body">
                    <h5 class="card-title">Solicitar Certificado de Ingresos</h5>
                    <p class="card-text text-muted">Certificado de ingresos y retenciones.</p>
                    <button class="btn btn-primary w-100" type="button">Ir</button>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card h-100 shadow-sm">
                <div class="card-body">
                    <h5 class="card-title">Mis Vacaciones</h5>
                    <p class="card-text text-muted">Consulta o solicita periodos de vacaciones.</p>
                    <button class="btn btn-primary w-100" type="button">Ir</button>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
