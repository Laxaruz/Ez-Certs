<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EZ CERTS | Crear Usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/login.css}" href="/css/login.css" />
    <link rel="stylesheet" th:href="@{/css/dashboard.css}" href="/css/dashboard.css" />
    <style>
        .container {
            width: min(100% - 2rem, 1140px);
            margin: 0 auto;
        }
        .row {
            display: flex;
            flex-wrap: wrap;
            margin: 0 -0.75rem;
        }
        .row > * {
            box-sizing: border-box;
            width: 100%;
            padding: 0 0.75rem;
        }
        .justify-content-center {
            justify-content: center;
        }
        .justify-content-between {
            justify-content: space-between;
        }
        .align-items-center {
            align-items: center;
        }
        .d-flex {
            display: flex;
        }
        .gap-2 {
            gap: 0.5rem;
        }
        .col-lg-8 {
            max-width: 860px;
        }
        .col-md-6 {
            width: 50%;
        }
        .col-md-3 {
            width: 25%;
        }
        .col-12 {
            width: 100%;
        }
        .pt-4 {
            padding-top: 1.5rem;
        }
        .pt-2 {
            padding-top: 0.5rem;
        }
        .py-2 {
            padding-top: 0.5rem;
            padding-bottom: 0.5rem;
        }
        .pb-5 {
            padding-bottom: 3rem;
        }
        .me-3 {
            margin-right: 1rem;
        }
        .mb-3 {
            margin-bottom: 1rem;
        }
        .mb-4 {
            margin-bottom: 1.5rem;
        }
        .mb-0 {
            margin-bottom: 0;
        }
        .text-center {
            text-align: center;
        }
        .text-muted {
            color: #6c757d;
        }
        .fw-bold {
            font-weight: 700;
        }
        .card {
            background: #fff;
            border-radius: 18px;
        }
        .border-0 {
            border: 0;
        }
        .shadow-lg {
            box-shadow: 0 28px 80px rgba(33, 37, 41, 0.14);
        }
        .card-body {
            padding: 2rem;
        }
        .p-4 {
            padding: 1.5rem;
        }
        .p-md-5 {
            padding: 3rem;
        }
        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #0b2d4f;
        }
        .form-control,
        .form-select {
            width: 100%;
            padding: 0.85rem 1rem;
            border: 1px solid #ced4da;
            border-radius: 0.75rem;
            background: #fff;
            font-size: 1rem;
        }
        .form-control:focus,
        .form-select:focus {
            outline: 0;
            border-color: #86b7fe;
            box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, 0.2);
        }
        .form-check {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            min-height: 100%;
        }
        .form-check-input {
            width: 1rem;
            height: 1rem;
            margin: 0;
        }
        .form-check-label {
            color: #0b2d4f;
            font-weight: 500;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.85rem 1.5rem;
            border-radius: 0.75rem;
            border: 1px solid transparent;
            cursor: pointer;
            text-decoration: none;
            font-weight: 600;
        }
        .btn-primary {
            background: linear-gradient(180deg, #0d6efd, #0a5cb6);
            color: #fff;
        }
        .btn-outline-secondary {
            background: #fff;
            border-color: #ced4da;
            color: #495057;
        }
        .px-4 {
            padding-left: 1.5rem;
            padding-right: 1.5rem;
        }
        .alert {
            padding: 1rem;
            border-radius: 0.75rem;
            margin-bottom: 1rem;
        }
        .alert-danger {
            color: #842029;
            background: #f8d7da;
            border: 1px solid #f5c2c7;
        }
        @media (max-width: 768px) {
            .col-md-6,
            .col-md-3 {
                width: 100%;
            }
            .p-md-5 {
                padding: 1.5rem;
            }
            .col-lg-8 {
                max-width: 100%;
            }
        }
    </style>
</head>
<body class="bg-light">
<header class="app-header">
    <div class="container d-flex align-items-center justify-content-between py-2">
        <div class="d-flex align-items-center">
            <div class="me-3"><span class="app-logo">EZ CERTS</span><div class="small text-muted">Gestión de Certificados Laborales</div></div>
        </div>
        <div class="d-flex align-items-center" th:if="${!setupInicial}">
            <form th:action="@{/logout}" method="post" class="m-0">
                <button class="btn btn-outline-danger btn-sm">Salir</button>
            </form>
        </div>
    </div>
</header>

<section class="hero-bg pb-5">
    <div class="container pt-4">
        <div class="mb-3" th:if="${!setupInicial}">
            <a th:href="@{/dashboard/usuarios-activos}" class="text-decoration-none text-muted" style="font-weight: 500; font-size: 0.95rem;">
                <i class="bi bi-arrow-left me-1"></i> Volver a usuarios activos
            </a>
        </div>

        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow-lg border-0">
                    <div class="card-body p-4 p-md-5">
                        <div class="mb-4 text-center">
                            <h2 class="fw-bold mb-2" style="color: #0b2d4f;" th:text="${setupInicial} ? 'Configurar administrador inicial' : 'Crear usuario'">Crear usuario</h2>
                            <p class="text-muted mb-0" th:if="${setupInicial}">
                                La base de datos no tiene usuarios. Crea el primer administrador para poder iniciar sesión.
                            </p>
                        </div>

                        <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

                        <form th:action="${formAction}" th:object="${usuarioDto}" method="post" class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">Nombre completo</label>
                                <input type="text" class="form-control" th:field="*{nombre}" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Correo electrónico</label>
                                <input type="email" class="form-control" th:field="*{correo}" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Contraseña</label>
                                <input type="password" class="form-control" th:field="*{contrasena}" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Confirmar contraseña</label>
                                <input type="password" class="form-control" th:field="*{confirmarContrasena}" required>
                            </div>

                            <th:block th:if="${setupInicial}">
                                <input type="hidden" th:field="*{rol}" value="ADMIN">
                                <input type="hidden" th:name="activo" value="true">
                            </th:block>

                            <th:block th:unless="${setupInicial}">
                                <div class="col-md-6">
                                    <label class="form-label">Rol</label>
                                    <select class="form-select" th:field="*{rol}" required>
                                        <option value="">Seleccione</option>
                                        <option value="ADMIN">ADMIN</option>
                                        <option value="RRHH">RRHH</option>
                                        <option value="EMPLEADO">EMPLEADO</option>
                                    </select>
                                </div>
                                <div class="col-md-6 d-flex align-items-end">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" th:field="*{activo}">
                                        <label class="form-check-label">Usuario activo</label>
                                    </div>
                                </div>
                            </th:block>

                            <div class="col-md-6">
                                <label class="form-label">Cédula</label>
                                <input type="text" class="form-control" th:field="*{cedula}">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Área</label>
                                <input type="text" class="form-control" th:field="*{area}">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Cargo</label>
                                <input type="text" class="form-control" th:field="*{cargo}">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Fecha de ingreso</label>
                                <input type="date" class="form-control" th:field="*{fechaIngreso}">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Salario</label>
                                <input type="number" step="0.01" min="0" class="form-control" th:field="*{salario}">
                            </div>

                            <div class="col-12 d-flex justify-content-end gap-2 pt-2">
                                <a th:if="${!setupInicial}" th:href="@{/dashboard/usuarios-activos}" class="btn btn-outline-secondary">Cancelar</a>
                                <button type="submit" class="btn btn-primary px-4" th:text="${setupInicial} ? 'Crear administrador' : 'Guardar usuario'">Guardar usuario</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>
