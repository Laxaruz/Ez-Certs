<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EZ CERTS | Solicitar Certificado</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/login.css}" href="/css/login.css" />
    <link rel="stylesheet" th:href="@{/css/dashboard.css}" href="/css/dashboard.css" />
    <link rel="stylesheet" th:href="@{/css/solicitar-certificado.css}" href="/css/solicitar-certificado.css" />
    <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css" />
    <link rel="stylesheet" th:href="@{/css/experience.css}" href="/css/experience.css" />
<link rel="icon" type="image/svg+xml" th:href="@{/img/ez-certs-logo.svg}" href="/img/ez-certs-logo.svg">
</head>
<body class="bg-light">
<header class="site-header"><div class="shell header-inner"><a class="brand" th:href="@{/dashboard/empleado}" href="/dashboard/empleado"><img class="brand-lockup" th:src="@{/img/ez-certs-wordmark-compact.svg}" src="/img/ez-certs-wordmark-compact.svg" alt="EZ CERTS — Gestión laboral" width="205" height="48"></a><nav class="main-nav" aria-label="Navegación principal"><a class="nav-link" th:href="@{/dashboard/empleado}" href="/dashboard/empleado">Mi espacio</a><a class="nav-link active" th:href="@{/dashboard/empleado/solicitar-certificado}" href="/dashboard/empleado/solicitar-certificado">Solicitar</a></nav><div class="header-actions"><span class="role-chip">Empleado</span><form th:action="@{/logout}" action="/logout" method="post"><button class="logout-button" type="submit" aria-label="Cerrar sesión" title="Cerrar sesión"><i class="bi bi-box-arrow-right"></i><span>Salir</span></button></form></div></div></header>

<section class="hero-bg pb-5">
    <div class="container">

        <div class="form-wrapper mt-4 mx-auto" style="max-width: 800px;">
            <!-- Botón de regreso -->
            <div class="mb-2">
                <a th:href="@{/dashboard/empleado}" class="text-decoration-none text-muted" style="font-weight: 500; font-size: 0.95rem;">
                    <i class="bi bi-arrow-left me-1"></i> Volver al Dashboard
                </a>
            </div>

            <div class="card shadow-lg border-0 rounded-4">
                <div class="card-body p-5">

                    <!-- Breadcrumbs -->
                    <nav aria-label="breadcrumb" class="mb-4">
                        <ol class="breadcrumb">
                            <li class="breadcrumb-item"><a th:href="@{/dashboard/empleado}" class="text-decoration-none">Inicio</a></li>
                            <li class="breadcrumb-item active" aria-current="page">Solicitar Certificado</li>
                        </ol>
                    </nav>

                    <h3 class="mb-4 text-primary font-weight-bold" style="color: #0b2d4f !important; font-weight: 700;">Solicitar Certificado</h3>

                    <!-- Stepper -->
                    <div class="stepper-wrapper mb-5">
                        <div class="step active">
                            <div class="circle">1</div>
                            <div class="label">Tipo</div>
                        </div>
                        <div class="line"></div>
                        <div class="step">
                            <div class="circle">2</div>
                            <div class="label">Datos</div>
                        </div>
                        <div class="line"></div>
                        <div class="step">
                            <div class="circle">3</div>
                            <div class="label">Vista previa</div>
                        </div>
                        <div class="line"></div>
                        <div class="step">
                            <div class="circle">4</div>
                            <div class="label">Generar</div>
                        </div>
                    </div>

                    <h6 class="mb-3 text-secondary font-weight-bold" style="color: #6c8aab !important; font-weight: 600;">Selecciona el tipo de certificado</h6>

                    <!-- Options Grid -->
                    <form th:action="@{/dashboard/empleado/solicitar-certificado/datos}" method="get" id="tipoCertificadoForm">
                        <div class="row g-3 mb-4">

                            <div class="col-md-6">
                                <label class="cert-option card h-100">
                                    <input type="radio" name="tipo" value="LABORAL" class="visually-hidden" checked>
                                    <div class="card-body">
                                        <span class="option-icon"><i class="bi bi-briefcase"></i></span>
                                        <h6 class="cert-title mb-1">Certificado Laboral</h6>
                                        <p class="cert-desc mb-0 text-muted small">Vinculación y cargo actual</p>
                                    </div>
                                </label>
                            </div>

                            <div class="col-md-6">
                                <label class="cert-option card h-100">
                                    <input type="radio" name="tipo" value="INGRESOS" class="visually-hidden">
                                    <div class="card-body">
                                        <span class="option-icon"><i class="bi bi-graph-up-arrow"></i></span>
                                        <h6 class="cert-title mb-1">Certificado de Ingresos</h6>
                                        <p class="cert-desc mb-0 text-muted small">Salario y deducciones</p>
                                    </div>
                                </label>
                            </div>

                            <div class="col-md-6">
                                <label class="cert-option card h-100">
                                    <input type="radio" name="tipo" value="EXPERIENCIA" class="visually-hidden">
                                    <div class="card-body">
                                        <span class="option-icon"><i class="bi bi-award"></i></span>
                                        <h6 class="cert-title mb-1">Certificado de Experiencia</h6>
                                        <p class="cert-desc mb-0 text-muted small">Tiempo laborado y funciones</p>
                                    </div>
                                </label>
                            </div>

                            <div class="col-md-6">
                                <label class="cert-option card h-100">
                                    <input type="radio" name="tipo" value="ESTUDIOS" class="visually-hidden">
                                    <div class="card-body">
                                        <span class="option-icon"><i class="bi bi-mortarboard"></i></span>
                                        <h6 class="cert-title mb-1">Certificado de Estudios</h6>
                                        <p class="cert-desc mb-0 text-muted small">Nivel educativo certificado</p>
                                    </div>
                                </label>
                            </div>

                        </div>

                        <!-- Continue button -->
                        <div class="text-center mt-5">
                            <button type="submit" class="btn btn-primary btn-continue px-5 py-2 w-100" id="btnContinuar" style="max-width: 600px;">
                                Continuar <i class="bi bi-arrow-right ms-2"></i>
                            </button>
                        </div>
                    </form>

                </div>
            </div>
        </div>

    </div>
</section>

<footer class="site-footer"><div class="shell footer-inner"><span><b>EZ CERTS</b> · Gestión laboral</span><span>Documentos laborales, a tu alcance.</span></div></footer>

</body>
</html>
