<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EZ CERTS | Iniciar sesion</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
</head>
<body class="bg-light">
<div class="container min-vh-100 d-flex align-items-center justify-content-center">
    <div class="card shadow-sm" style="max-width: 420px; width: 100%;">
        <div class="card-body p-4">
            <h1 class="h4 mb-3 text-center">EZ CERTS</h1>
            <p class="text-muted text-center mb-4">Acceso a la plataforma</p>

            <div class="alert alert-danger" th:if="${param.error}">Credenciales invalidas</div>
            <div class="alert alert-success" th:if="${param.logout}">Has cerrado sesion correctamente</div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label class="form-label" for="username">Usuario o correo</label>
                    <input class="form-control" type="text" id="username" name="username" required />
                </div>
                <div class="mb-3">
                    <label class="form-label" for="password">Contrasena</label>
                    <input class="form-control" type="password" id="password" name="password" required />
                </div>
                <button class="btn btn-primary w-100" type="submit">Ingresar</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
