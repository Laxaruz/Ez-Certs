<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EZ CERTS | Certificado Generado</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/login.css}" />
    <link rel="stylesheet" th:href="@{/css/dashboard.css}" />
    <link rel="stylesheet" th:href="@{/css/solicitar-certificado.css}" />
    <style>
        .success-icon-container {
            width: 120px;
            height: 120px;
            background-color: #28a745;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px;
            animation: popIn 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards;
            opacity: 0;
            transform: scale(0.5);
        }

        .success-icon-container i {
            font-size: 5rem;
            color: white;
        }

        @keyframes popIn {
            0% {
                opacity: 0;
                transform: scale(0.5);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        .success-card {
            text-align: center;
            padding: 50px 30px;
        }

        .success-title {
            color: #0b2d4f;
            font-weight: 700;
            margin-bottom: 15px;
        }

        .success-message {
            color: #6c8aab;
            font-size: 1.1rem;
            margin-bottom: 40px;
        }
    </style>
    <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css" />
    <link rel="stylesheet" th:href="@{/css/experience.css}" href="/css/experience.css" />
</head>
<body class="bg-light">
<header class="site-header"><div class="shell header-inner"><a class="brand" th:href="@{/dashboard/empleado}" href="/dashboard/empleado"><span class="brand-mark">E<span>✓</span></span><span>EZ CERTS<small>Gestión laboral</small></span></a><nav class="main-nav" aria-label="Navegación principal"><a class="nav-link" th:href="@{/dashboard/empleado}" href="/dashboard/empleado">Mi espacio</a><a class="nav-link active" th:href="@{/dashboard/empleado/solicitar-certificado}" href="/dashboard/empleado/solicitar-certificado">Solicitar</a></nav><div class="header-actions"><span class="role-chip">Empleado</span><form th:action="@{/logout}" action="/logout" method="post"><button class="logout-button" type="submit" aria-label="Cerrar sesión" title="Cerrar sesión"><i class="bi bi-box-arrow-right"></i><span>Salir</span></button></form></div></div></header>

<section class="hero-bg pb-5">
    <div class="container d-flex justify-content-center align-items-center" style="min-height: 70vh;">
        <div class="card shadow-lg border-0 rounded-4 w-100" style="max-width: 600px;">
            <div class="card-body success-card">

                <div class="success-icon-container shadow">
                    <i class="bi bi-check-lg"></i>
                </div>

                <h2 class="success-title">¡Certificado Emitido con Éxito!</h2>
                <p class="success-message">Su documento se ha generado correctamente. La descarga iniciará automáticamente en unos segundos.</p>

                <div class="d-grid gap-3 d-sm-block mt-4">
                    <a th:href="@{/dashboard/empleado}" class="btn btn-primary px-5 py-3 rounded-pill text-white shadow-sm" style="background-color: #235487; border-color: #235487; font-weight: 600;">
                        <i class="bi bi-house-door me-2"></i>Ir al Dashboard
                    </a>
                    <a th:href="@{/dashboard/empleado/solicitar-certificado/descargar/{id}(id=${certificado.id})}" class="btn btn-outline-secondary px-4 py-3 rounded-pill shadow-sm ms-sm-2 mt-3 mt-sm-0">
                        <i class="bi bi-download me-2"></i>Descargar de nuevo
                    </a>
                </div>

            </div>
        </div>
    </div>
</section>

<footer class="site-footer"><div class="shell footer-inner"><span><b>EZ CERTS</b> · Gestión laboral</span><span>Documentos laborales, a tu alcance.</span></div></footer>

<script th:inline="javascript">
    document.addEventListener("DOMContentLoaded", function() {
        // Auto-download the PDF after a short delay so the user can see the success animation
        setTimeout(function() {
            var certId = /*[[${certificado.id}]]*/ 0;
            window.location.href = '/dashboard/empleado/solicitar-certificado/descargar/' + certId;
        }, 1500);
    });
</script>
</body>
</html>
